# link.hewanorraexpress.com — the Hewanorra Express links page.
#
# A single self-contained index.html plus the background video, poster, logo
# and link-preview image. It shares nothing with any other site on this
# droplet, so it gets its own root and its own server block.
#
# Install with deploy/provision.sh, NOT by copying this over a live conf:
# once certbot has run it rewrites the live file in place to add the SSL
# block, and copying over it destroys the HTTPS config.
server {
    listen 80;
    listen [::]:80;
    server_name link.hewanorraexpress.com;

    root /var/www/hewanorra-link;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    # video/mp4 is deliberately absent: compressing it breaks the byte-range
    # requests Safari needs to start playback. nginx always gzips text/html
    # regardless of this list.
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Logo, poster and preview image: stable files, safe to cache.
    location ~* \.(?:jpg|jpeg|png|webp|svg|ico)$ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    # The background video. Safari will not start playback without range
    # requests; nginx serves those by default, so the only job here is to
    # keep it uncompressed and cached hard.
    location ~* \.(?:mp4|webm)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ =404;

        # nginx does NOT inherit server-level add_header into a block that
        # sets its own, so these are declared here rather than above —
        # otherwise the HTML, where they matter most, would lose them.
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        # Never cache the HTML, so an edit is visible on the next reload.
        add_header Cache-Control "no-cache" always;
    }
}
